    // ═══════════════════════════════════════════════════════════════
    // РАНЖИРОВАНИЕ
    // ═══════════════════════════════════════════════════════════════
    function scoreContractor(c, stages) {
      const cov = stages.filter(s => c.services[s]).length;
      const svc = stages.length > 0 ? cov / stages.length : 1;
      const price = { cheap:0.10, mid:0, premium:-0.05 }[c.priceLevel] || 0;
      const rat = c.rating ? ((c.rating - 4.0) / 1.0) * 0.10 : 0;
      return { raw: svc + price + rat, serviceScore: Math.round(svc * 100), covered: cov };
    }
    function rankContractors(contractors, stages) {
      const scored = contractors.map(c => ({ ...c, ...scoreContractor(c, stages) })).sort((a, b) => b.raw - a.raw);
      const result = []; let i = 0;
      while (i < scored.length) {
        let j = i + 1;
        while (j < scored.length && scored[i].raw - scored[j].raw < 0.05) j++;
        result.push(...scored.slice(i, j).sort(() => Math.random() - 0.5));
        i = j;
      }
      return result;
    }

    // ═══════════════════════════════════════════════════════════════
    // РАСЧЁТНЫЙ ДВИЖОК
    // ═══════════════════════════════════════════════════════════════
    function calcStage(stage, sel, profile, area) {
      const p = profile.prices;
      if (!profile.services[stage]) return { cost: 0, available: false };
      const sa = sel.stageAreas || {};
      const zA = sa[stage] && Number(sa[stage]) > 0 ? Number(sa[stage]) : area;

      switch (stage) {
        case "demolition": {
          if (!sel.demolition || sel.demolition === "none") return { cost: 0, available: true };
          const k = { light:"demolitionLightM2", medium:"demolitionMediumM2", full:"demolitionFullM2" }[sel.demolition];
          return { cost: area * (p[k] || 0), available: true };
        }
        case "wasteRemoval":
          return { cost: sel.wasteRemoval === "yes" ? (p.wasteRemovalFixed || 0) : 0, available: true };
        case "roughWorks": {
          const items = sel.roughItems || [];
          if (items.length === 0) return { cost: 0, available: true };
          const wallArea = area * 2.6;
          let roughCost = 0;
          if (items.includes("plastering"))    roughCost += wallArea * (p.plasteringM2 || 0);
          if (items.includes("screed"))        roughCost += area * (p.screedM2 || 0);
          if (items.includes("selfLeveling"))  roughCost += area * (p.selfLevelingM2 || 0);
          if (items.includes("radiators"))     roughCost += (Number(sel.radiatorCount)||0) * (p.radiatorUnit || 0);
          if (items.includes("soundproofing")) roughCost += area * (p.soundproofingM2 || 0);
          return { cost: roughCost, available: true };
        }
        case "electric": {
          const outlets  = Number(sel.electricOutlets)  || 0;
          const switches = Number(sel.electricSwitches) || 0;
          const lights   = Number(sel.electricLights)   || 0;
          const cost = outlets * (p.electricOutletPrice || 4500)
                     + switches * (p.electricSwitchPrice || 3500)
                     + lights * (p.electricLightPrice || 3000);
          return { cost, available: true };
        }
        case "plumbing": {
          if (!sel.plumbing || sel.plumbing === "none") return { cost: 0, available: true };
          const meters  = Number(sel.plumbingMeters) || 0;
          const locCoef = CONFIG.coefs.plumbingLocation[sel.plumbingLocation || ""] || 1.0;
          if (meters > 0) {
            const rate = sel.plumbing === "partial"
              ? (p.plumbingMeterPartial || 9000)
              : (p.plumbingMeterFull || 15000);
            return { cost: meters * rate * locCoef, available: true };
          }
          return { cost: sel.plumbing === "partial" ? (p.plumbingPartialFixed || 0) : (p.plumbingFullFixed || 0), available: true };
        }
        case "bathroom": {
          if (!sel.bathroom || sel.bathroom === "none") return { cost: 0, available: true };
          const count = sel.bathroomCount === "2" ? 2 : 1;
          const bCosts = {
            replace_only: (p.bathroomReplaceFixed || 350000) * count,
            cosmetic:     (p.bathroomCosmeticFixed || 450000) * count,
            partial:      (p.bathroomPartialFixed || 800000) * count,
            full_1:        p.bathroomFullOneFixed || 1200000,
            full_2:        p.bathroomFullTwoFixed || 2200000,
          };
          return { cost: bCosts[sel.bathroom] || 0, available: true };
        }
        case "kitchen":
          if (!sel.kitchen || sel.kitchen === "none") return { cost: 0, available: true };
          return { cost: sel.kitchen === "basic" ? (p.kitchenBasicFixed || 0) : (p.kitchenWithApronFixed || 0), available: true };
        case "ceiling":
          if (!sel.ceiling || sel.ceiling === "none") return { cost: 0, available: true };
          const cPrices = { stretch: p.ceilingStretchM2||4000, paint: p.ceilingPaintM2||8000, gypsum: p.ceilingGypsumM2||8500 };
          return { cost: area * (cPrices[sel.ceiling] || 0), available: true };
        case "floor": {
          if (!sel.floorCovering || sel.floorCovering === "none") return { cost: 0, available: true };
          const k = { linoleum:"floorLinoleumM2", laminate:"floorLaminateM2", spc:"floorSpcM2", tile:"floorTileM2" }[sel.floorCovering];
          // Авто-выравнивание если стяжка уже в черновых
          const hasScreed = (sel.roughItems||[]).includes("screed");
          const needLeveling = hasScreed || sel.floorLeveling === "yes";
          return { cost: area * (p[k] || 0) + (needLeveling ? area * (p.floorLevelingM2 || 0) : 0), available: true };
        }
        case "walls": {
          if (!sel.walls || sel.walls === "none") return { cost: 0, available: true };
          const k = { wallpaper:"wallsWallpaperM2", paint:"wallsPaintM2", decorative:"wallsDecorativeM2" }[sel.walls];
          // Авто-выравнивание если штукатурка уже в черновых
          const hasPlaster = (sel.roughItems||[]).includes("plastering");
          const needWallLevel = hasPlaster || sel.wallLeveling === "yes";
          return { cost: area * (p[k] || 0) + (needWallLevel ? area * (p.wallLevelingM2 || 0) : 0), available: true };
        }
        default: return { cost: 0, available: true };
      }
    }

    // ─────────────────────────────────────────────
    // СРОКИ ЭТАПОВ
    // ─────────────────────────────────────────────
    function calcDuration(stage, sel) {
      const area = Number(sel.area) || 50;
      switch (stage) {
        case "demolition": {
          if (!sel.demolition || sel.demolition === "none") return null;
          // Лёгкий: обои, плинтуса, плитка
          // Средний: перегородки, стяжка, мебель
          // Полный: до бетона, трубы, всё
          const days = {
            light:  { min: 1, max: Math.max(2, Math.ceil(area / 25)) },
            medium: { min: 2, max: Math.max(4, Math.ceil(area / 15)) },
            full:   { min: 4, max: Math.max(7, Math.ceil(area / 10)) },
          }[sel.demolition];
          return days || null;
        }
        case "wasteRemoval":
          return sel.wasteRemoval === "yes" ? { min: 1, max: 1 } : null;
        case "roughWorks": {
          const items = sel.roughItems || [];
          if (items.length === 0) return null;
          let min = 0, max = 0;
          if (items.includes("plastering"))   { min += Math.ceil(area * 2.6 / 60); max += Math.ceil(area * 2.6 / 40); }
          if (items.includes("screed"))       { min += Math.ceil(area / 60); max += Math.ceil(area / 40); }
          if (items.includes("selfLeveling")) { min += 1; max += 2; }
          if (items.includes("radiators"))    { min += 1; max += 2; }
          if (items.includes("soundproofing")){ min += Math.ceil(area / 50); max += Math.ceil(area / 30); }
          return min > 0 ? { min: Math.max(1, min), max: Math.max(2, max) } : null;
        }
        case "electric": {
          const pts = (Number(sel.electricOutlets)||0) + (Number(sel.electricSwitches)||0) + (Number(sel.electricLights)||0);
          if (pts === 0) return null;
          const base = Math.ceil(pts / 12);
          return { min: Math.max(2, base), max: Math.max(4, base + 2) };
        }
        case "plumbing": {
          if (!sel.plumbing || sel.plumbing === "none") return null;
          if (sel.plumbing === "partial") return { min: 2, max: 3 };
          const meters = Number(sel.plumbingMeters) || 0;
          const base = meters > 0 ? Math.ceil(meters / 8) : 5;
          return { min: Math.max(3, base), max: Math.max(5, base + 2) };
        }
        case "bathroom": {
          if (!sel.bathroom || sel.bathroom === "none") return null;
          return { cosmetic: {min:3,max:5}, full_1: {min:10,max:14}, full_2: {min:18,max:25} }[sel.bathroom] || null;
        }
        case "kitchen": {
          if (!sel.kitchen || sel.kitchen === "none") return null;
          return { basic: {min:3,max:5}, with_apron: {min:4,max:7} }[sel.kitchen] || null;
        }
        case "ceiling": {
          if (!sel.ceiling || sel.ceiling === "none") return null;
          return { stretch: {min:1,max:2}, paint: {min:3,max:5} }[sel.ceiling] || null;
        }
        case "floor": {
          if (!sel.floorCovering || sel.floorCovering === "none") return null;
          const base = { linoleum:{min:1,max:2}, laminate:{min:2,max:3}, spc:{min:2,max:3},
            tile:{min:Math.ceil(area/20)+1, max:Math.ceil(area/15)+2} }[sel.floorCovering];
          if (!base) return null;
          if (sel.floorLeveling === "yes") return { min: base.min + 2, max: base.max + 3 };
          return base;
        }
        case "walls": {
          if (!sel.walls || sel.walls === "none") return null;
          const wallDays = Math.ceil(area * 2.6 / 50);
          const base = {
            wallpaper:   { min: wallDays + 1, max: wallDays + 3 },
            paint:       { min: wallDays + 2, max: wallDays + 4 },
            decorative:  { min: wallDays + 5, max: wallDays + 8 },
          }[sel.walls];
          if (!base) return null;
          if (sel.wallLeveling === "yes") return { min: base.min + 4, max: base.max + 6 };
          return base;
        }
        default: return null;
      }
    }

    function calcTotalDuration(stages, sel) {
      let min = 0, max = 0;
      for (const s of stages) {
        const d = calcDuration(s, sel);
        if (d) { min += d.min; max += d.max; }
      }
      return min > 0 ? { min, max } : null;
    }

    function calculateTotal(sel, profile) {
      const area  = Number(sel.area) || 0;
      const coef  = (CONFIG.coefs.condition[sel.condition] || 1)
                  * (CONFIG.coefs.living[sel.isLiving] || 1)
                  * (CONFIG.coefs.lift[sel.hasLift] || 1);
      const stages = sel.selectedStages || [];
      const breakdown = {}; let workTotal = 0;

      for (const s of stages) {
        const r = calcStage(s, sel, profile, area);
        const cost = r.available ? Math.round(r.cost * coef) : 0;
        breakdown[s] = { cost, available: r.available };
        workTotal += cost;
      }
      const matCost = sel.includeMaterials === "yes"
        ? Math.round(workTotal * (profile.prices.materialsPercent || 0.37)) : 0;
      const grand = workTotal + matCost;
      const unavail = stages.filter(s => !profile.services[s]);
      const compat  = stages.length > 0
        ? Math.round(stages.filter(s => profile.services[s]).length / stages.length * 100) : 100;

      return {
        workTotal, matCost, grand,
        wMin: Math.round(workTotal * CONFIG.range.min),
        wMax: Math.round(workTotal * CONFIG.range.max),
        gMin: Math.round(grand * CONFIG.range.min),
        gMax: Math.round(grand * CONFIG.range.max),
        breakdown, unavail, compat,
      };
    }

      const timing  = { asap:"Как можно скорее", month:"В течение месяца", quarter:"В этом квартале", planning:"Пока планирую" };
      const scope   = { full_repair:"Весь ремонт", selected_stages:"По этапам", not_sure:"Ориентир" };
      const sa = sel.stageAreas || {};
      const fmt = n => Math.round(n).toLocaleString("ru-RU");

      // Детали по каждому этапу
      const stageLines = sel.selectedStages.map(s => {
        const area = sa[s] ? ` · ${sa[s]} м²` : "";
        switch(s) {

            const dtype = {light:"лёгкий (обои, плитка)", medium:"средний (перегородки, стяжка)", full:"полный (до бетона, трубы)", none:""}[sel.demolition] || "";
            return `  ⚒ Демонтаж: ${dtype}${area}`;
          case "wasteRemoval":
            return `  🚛 Вывоз мусора`;
          case "roughWorks":
            const ri = sel.roughItems || [];
            const rmap = {plastering:"штукатурка", screed:"стяжка", selfLeveling:"наливной пол", radiators:`радиаторы ${sel.radiatorCount||""}шт`, soundproofing:"звукоизоляция"};
            const rlist = ri.map(x => rmap[x]||x).join(", ");
            return `  🧱 Черновые: ${rlist||"—"}`;
          case "electric":
            const outlets  = sel.electricOutlets  ? `розетки: ${sel.electricOutlets}` : "";
            const switches = sel.electricSwitches ? `выключатели: ${sel.electricSwitches}` : "";

            return `  ⚡ Электрика${area}: ${eparts||"—"}`;

            const ptype = {partial:"частичная", full:"полная замена", none:""}[sel.plumbing] || "";
            const pm = sel.plumbingMeters ? ` · ${sel.plumbingMeters} п.м.` : "";
            const ploc = {sanuzul:"санузел", kitchen:"кухня", all:"везде"}[sel.plumbingLocation] || "";
            return `  🚿 Сантехника: ${ptype}${pm}${ploc ? ` · ${ploc}` : ""}`;
          case "bathroom":
            const btype = {cosmetic:"косметика", full_1:"полный 1 санузел", full_2:"полный 2 санузла", none:""}[sel.bathroom] || "";
            const bfix  = {shower:"душевая кабина", bath:"ванна", both:"душ + ванна"}[sel.bathroomFixtureType] || "";
            return `  🛁 Санузел: ${btype}${bfix ? ` · ${bfix}` : ""}${area}`;
          case "kitchen":
            const ktype = {basic:"обычный", with_apron:"с фартуком", none:""}[sel.kitchen] || "";
            return `  🍳 Кухня: ${ktype}${area}`;
          case "ceiling":
            const ctype = {stretch:"натяжной", paint:"под покраску", none:""}[sel.ceiling] || "";
            return `  ▣ Потолки: ${ctype}`;
          case "floor":

      return `🏗 <b>Новая заявка RAVIO · ${CONFIG.city}</b>\n\n`

        + `📞 ${lead.phone} · ${contact[lead.contact]||lead.contact}\n`

    // Fetch с таймаутом — не висит вечно
    async function fetchWithTimeout(url, options, ms = 7000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(url, { ...options, signal: ctrl.signal });
        return r;
      } catch (e) {
        console.warn("fetchWithTimeout:", e.message);
      } finally {
        clearTimeout(timer);
      }
    }

    );

    const StepLabel = ({ label }) => (
      <div style={{ fontSize:10, fontWeight:700, color:T.textMuted, letterSpacing:"0.1em",
        textTransform:"uppercase", marginBottom:10 }}>{label}</div>
    );

    const Btn = ({ children, onClick, style={}, disabled=false }) => (
      <button onClick={onClick} disabled={disabled} className="rayo-btn-main" style={{
        display:"flex", alignItems:"center", justifyContent:"center", gap:8,
        padding:"15px 24px", background: disabled ? "#E8E5DE" : T.accent,
        color: disabled ? T.textMuted : T.text, border:"none", borderRadius:T.rBtn,
        fontSize:15, fontWeight:700, cursor: disabled ? "not-allowed" : "pointer",
        width:"100%", letterSpacing:-0.2, ...style,
      }}>{children}</button>
    );

    const BtnGhost = ({ children, onClick, style={} }) => (
      <button onClick={onClick} className="rayo-btn-ghost" style={{
        padding:"13px 20px", background:"transparent", border:`1.5px solid ${T.border}`,
        borderRadius:T.rBtn, fontSize:14, fontWeight:600, color:T.textSub,
        cursor:"pointer", ...style,
      }}>{children}</button>
    );

    const BtnOutline = ({ children, onClick, style={} }) => (
      <button onClick={onClick} className="rayo-btn-ghost" style={{
        display:"flex", alignItems:"center", justifyContent:"center", gap:6,
        padding:"13px 20px", background:"transparent", border:`1.5px solid ${T.border}`,
        borderRadius:T.rBtn, fontSize:14, fontWeight:600, color:T.text,
        cursor:"pointer", ...style,
      }}>{children}</button>
    );

    const MiniProg = ({ current, total }) => (
      <div style={{ display:"flex", gap:4, marginBottom:16 }}>
        {Array.from({ length: total }).map((_, i) => (
          <div key={i} style={{ flex:1, height:3, borderRadius:2,
            background: i < current ? T.accent : i === current ? T.accent+"BB" : "#D4D0C8",
            transition:"background 0.3s" }}/>
        ))}
      </div>
    );

    const StageHeader = ({ icon, title, subtitle }) => (
      <div style={{ marginBottom:20 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:4 }}>
          <div style={{ width:40, height:40, borderRadius:10, background:T.accent,
            display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, color:T.text }}>
            {icon}
          </div>
          <h2 style={{ fontSize:26, fontWeight:900, color:T.text }}>{title}</h2>
        </div>
        {subtitle && <p style={{ fontSize:14, color:T.textSub, marginLeft:52 }}>{subtitle}</p>}
      </div>
    );

    const StagePill = ({ label, icon, selected, onClick }) => (
      <button onClick={onClick} data-active={selected} className="rayo-stage-pill" style={{
        display:"flex", alignItems:"center", gap:10, padding:"12px 14px",
        borderRadius:T.r, border:`1.5px solid ${selected ? T.text : T.border}`,
        background: selected ? T.text : T.bgCard, cursor:"pointer",
        textAlign:"left", width:"100%",
      }}>
        <div style={{ width:30, height:30, borderRadius:8, flexShrink:0,
          background: selected ? T.accent : "#F2F0EA",
          display:"flex", alignItems:"center", justifyContent:"center",
          color: selected ? T.text : T.textSub }}>
          {icon}
        </div>
        <span style={{ fontSize:13, fontWeight: selected ? 700 : 500,
          color: selected ? T.white : T.text, flex:1 }}>{label}</span>
        {selected && (
          <div style={{ width:20, height:20, borderRadius:"50%", background:T.accent, flexShrink:0,
            display:"flex", alignItems:"center", justifyContent:"center" }}>
            <Ico d="M5 9.5l3 3 5-5" size={11} stroke={T.text} sw="2"/>
          </div>
        )}
      </button>
    );

    const OptionRow = ({ icon, title, sub, onClick, active=false, right=null, iconBg }) => (
      <button onClick={onClick} data-active={active} className="rayo-option-row" style={{
        display:"flex", alignItems:"center", gap:12, padding:"14px 16px",
        background: active ? T.text : T.bgCard,
        border:`1.5px solid ${active ? T.text : T.border}`,
        borderRadius:T.r, cursor:"pointer", width:"100%", textAlign:"left",
        marginBottom:8,
      }}>
        <div style={{ width:36, height:36, borderRadius:10, flexShrink:0,
          background: active ? T.accent : iconBg || "#F2F0EA",
          display:"flex", alignItems:"center", justifyContent:"center",
          color: active ? T.text : T.textSub, fontSize:15 }}>
          {icon}
        </div>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:14, fontWeight:600, color: active ? T.white : T.text }}>{title}</div>
          {sub && <div style={{ fontSize:12, color: active ? "#9A9AB0" : T.textSub, marginTop:2 }}>{sub}</div>}
        </div>
        {right && <div style={{ color: active ? T.accent : T.textMuted, fontSize:13, fontWeight:700, whiteSpace:"nowrap" }}>{right}</div>}
        {active && (
          <div style={{ width:22, height:22, borderRadius:"50%", background:T.accent, flexShrink:0,
            display:"flex", alignItems:"center", justifyContent:"center", marginLeft:4 }}>
            <Ico d="M5 9.5l3 3 5-5" size={12} stroke={T.text} sw="2"/>
          </div>
        )}
      </button>
    );

    const NumInput = ({ label, value, onChange, min=0, max=9999, placeholder="0", suffix="" }) => (
      <div style={{ display:"flex", flexDirection:"column", gap:5, flex:1 }}>
        <label style={{ fontSize:12, fontWeight:600, color:T.textSub, textTransform:"uppercase", letterSpacing:"0.05em" }}>
          {label}
        </label>
        <div style={{ display:"flex", alignItems:"center", background:T.bgCard,
          border:`1.5px solid ${T.border}`, borderRadius:T.r, overflow:"hidden" }}>
          <input type="number" min={min} max={max} value={value} placeholder={placeholder}
            onChange={e => onChange(e.target.value)}
            onFocus={e => e.target.select()}
            style={{ flex:1, padding:"12px 12px", fontSize:16, fontWeight:700,
              border:"none", background:"transparent", color:T.text, width:"100%" }}/>
          {suffix && <span style={{ padding:"0 12px", fontSize:13, color:T.textMuted, whiteSpace:"nowrap" }}>{suffix}</span>}
        </div>
      </div>
    );

    const ZoneInput = ({ value, onChange, placeholder="Площадь этой зоны" }) => (
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16,
        background:T.bgCard, border:`1px solid ${T.border}`, borderRadius:T.r, padding:"10px 14px" }}>
        <Ico d="M3 3h12v12H3zM3 9h12M9 3v12" size={14} stroke={T.textMuted}/>
        <span style={{ fontSize:13, color:T.textSub, flex:1 }}>{placeholder}</span>
        <input type="number" min="1" max="500" value={value||""}
          onChange={e => onChange(e.target.value)}
          onFocus={e => e.target.select()}
          placeholder="—"
          style={{ width:60, padding:"4px 8px", borderRadius:6, border:`1px solid ${T.border}`,
            fontSize:16, fontWeight:700, textAlign:"center", background:T.bgPage, color:T.text }}/>
        <span style={{ fontSize:12, color:T.textMuted }}>м²</span>
        {value && <button onClick={()=>onChange("")} style={{ background:"none", border:"none",
          cursor:"pointer", color:T.textMuted, fontSize:12, padding:2 }}>✕</button>}
      </div>
    );

    // ═══════════════════════════════════════════════════════════════
    // ПАНЕЛЬ "ВАШИ ПАРАМЕТРЫ"
    // ═══════════════════════════════════════════════════════════════
    const SummaryPanel = ({ sel, isMobile }) => {
      const scopeLabel = { full_repair:"Весь ремонт", selected_stages:"По этапам", not_sure:"Ориентир" }[sel.calculationScope] || "";
      const condLabel  = { new_building:"Новостройка", secondary_normal:"Вторичка",
                           old_full_repair:"Под ремонт", very_bad:"Убитое" }[sel.condition] || "—";

      if (isMobile) {
        const filled = [sel.calculationScope, sel.area, sel.rooms, sel.condition].filter(Boolean);
        if (filled.length === 0) return null;
        return (
          <div style={{ background:T.bgDark, padding:"10px 20px", display:"flex",
            alignItems:"center", justifyContent:"space-between", gap:12 }}>
            <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
              {sel.calculationScope && <span style={{ fontSize:12, color:"rgba(255,255,255,0.6)" }}>{scopeLabel}</span>}
              {sel.area && <span style={{ fontSize:12, color:"rgba(255,255,255,0.6)" }}>{sel.area} м²</span>}
              {sel.rooms && <span style={{ fontSize:12, color:"rgba(255,255,255,0.6)" }}>{sel.rooms} комн.</span>}
              {sel.condition && <span style={{ fontSize:12, color:"rgba(255,255,255,0.6)" }}>{condLabel}</span>}
            </div>
            {sel.selectedStages.length > 0 && (
              <span style={{ fontSize:11, color:"rgba(255,255,255,0.35)", flexShrink:0 }}>
                {sel.selectedStages.length} этапов
              </span>
            )}
          </div>
        );
      }

      return (
        <div style={{ background:T.bgDark, borderRadius:T.rLg, padding:24, position:"sticky", top:20, overflow:"hidden" }}>
          <div style={{ position:"absolute", top:-60, right:-60, width:240, height:240,
            background:"radial-gradient(circle, rgba(245,200,66,0.12) 0%, transparent 65%)",
            pointerEvents:"none" }}/>

          <div style={{ position:"relative", marginBottom:16 }}>
            <span style={{ fontSize:11, color:"rgba(255,255,255,0.45)", textTransform:"uppercase", letterSpacing:"0.08em", fontWeight:600 }}>
              Ваши параметры
            </span>
          </div>

          <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
            {[
              ["Путь",      scopeLabel || "—"],
              ["Площадь",   sel.area ? sel.area+" м²" : "—"],
              ["Комнат",    sel.rooms || "—"],
              ["Состояние", sel.condition ? condLabel : "—"],
            ].map(([k,v]) => (
              <div key={k} style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>{k}</span>
                <span style={{ fontSize:13, color:v==="—"?"rgba(255,255,255,0.2)":"#fff", fontWeight:600 }}>{v}</span>
              </div>
            ))}
            {sel.selectedStages.length > 0 && (
              <div style={{ fontSize:12, color:T.accent, fontWeight:600, marginTop:2 }}>
                {sel.selectedStages.length} этапов выбрано
              </div>
            )}
          </div>

          <div style={{ borderTop:"1px solid rgba(255,255,255,0.08)", paddingTop:12 }}>
            <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)", display:"flex", alignItems:"center", gap:5 }}>
              <Ico d="M8 14A6 6 0 108 2a6 6 0 000 12zm0-4V8m0-3v.5" size={13} stroke="rgba(255,255,255,0.35)"/>
              {CONFIG.localEstimatesCount.toLocaleString("ru-RU")} локальных смет · {currentMonth}
            </div>
          </div>
        </div>
      );
    };

    const WizardWrap = ({ children, sel, liveResult, isMobile, animKey }) => (
      <div style={{ minHeight:"100vh", background:T.bgPage }}>
        {isMobile && <SummaryPanel sel={sel} isMobile/>}
        <div style={{ maxWidth:960, margin:"0 auto", padding:isMobile?"16px 16px 80px":"28px 24px 80px",
          display: isMobile ? "block" : "grid",
          gridTemplateColumns: "1fr 300px", gap:32 }}>
          <div key={animKey} className="rayo-anim">{children}</div>
          {!isMobile && <SummaryPanel sel={sel} isMobile={false}/>}
        </div>
      </div>
    );

    // ═══════════════════════════════════════════════════════════════
    // ЭКРАН РЕЗУЛЬТАТА
    // ═══════════════════════════════════════════════════════════════
    const ResultScreen = ({ sel, rankedContractors, onChoose, onBack, onReset }) => {
      const [activeId, setActiveId] = useState("independent");
      const allProfiles = [CONFIG.independent, ...rankedContractors];
      const indepResult = calculateTotal(sel, CONFIG.independent);
      const activeProfile = allProfiles.find(p => p.id === activeId) || CONFIG.independent;
      const activeResult = calculateTotal(sel, activeProfile);
      const displayStages = sel.selectedStages;
      const diff = activeProfile.type !== "baseline"
        ? Math.round((activeResult.grand - indepResult.grand) / indepResult.grand * 100) : 0;
      const isMobile = useIsMobile();
      const goMain = () => { window.location.href = INTEGRATIONS.mainSiteUrl; };

      return (
        <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
          <TopBar showBack onBack={onBack} onLogoClick={goMain}
            rightEl={
              <button onClick={onReset} style={{ fontSize:13, color:T.textSub, background:"none",
                border:"none", cursor:"pointer", fontWeight:600 }}>Начать сначала</button>
            }/>
          <div style={{ maxWidth:840, margin:"0 auto", padding: isMobile?"16px 16px 80px":"28px 24px 80px" }}
            className="rayo-anim">

            <div style={{ fontSize:12, color:T.textMuted, marginBottom:8 }}>
              {CONFIG.city} · {sel.rooms} комн. · {sel.area}м² · {sel.selectedStages.length} этапов
            </div>
            <StepLabel label="Результат"/>
            <h1 style={{ fontSize:isMobile?26:32, fontWeight:800, color:T.text, marginBottom:6, letterSpacing:-0.5 }}>
              Сравните подрядчиков
            </h1>
            <p style={{ fontSize:14, color:T.textSub, marginBottom:20, lineHeight:1.6 }}>
              Базовая колонка — независимая оценка рынка. Остальные — реальные подрядчики {CONFIG.city}.
            </p>

            <div style={{ display:"flex", gap:8, overflowX:"auto", paddingBottom:8, marginBottom:20 }}>
              {allProfiles.map(p => {
                const r = calculateTotal(sel, p);
                const isAct = p.id === activeId;
                const compatColor = r.compat >= 90 ? T.green : r.compat >= 70 ? "#B07800" : T.red;
                const compatBg    = r.compat >= 90 ? T.greenLight : r.compat >= 70 ? "#FFF8E0" : T.redLight;
                return (
                  <button key={p.id} onClick={() => setActiveId(p.id)} data-active={isAct} className="rayo-contractor-tab" style={{
                    display:"flex", flexDirection:"column", alignItems:"flex-start",
                    padding:"12px 16px", minWidth:155, flexShrink:0,
                    background: isAct ? T.text : T.bgCard,
                    border:`1.5px solid ${isAct ? T.text : T.border}`,
                    borderRadius:T.r, cursor:"pointer", transition:"all .15s",
                  }}>
                    <div style={{ fontSize:10, color: isAct ? "#888" : T.textMuted, marginBottom:4,
                      textTransform:"uppercase", letterSpacing:"0.06em" }}>
                      {p.type === "baseline" ? "Ориентир" : p.subtitle}
                    </div>
                    <div style={{ fontSize:13, fontWeight:700, color: isAct ? "#fff" : T.text, marginBottom:4 }}>
                      {p.name}
                    </div>
                    <div style={{ fontSize:17, fontWeight:900, color: isAct ? T.accent : T.text, marginBottom:6 }}>
                      {fmtK(r.grand)} ₸
                    </div>
                    {/* Совместимость — видна без клика */}
                    {p.type !== "baseline" && (
                      <div style={{ fontSize:10, fontWeight:700, padding:"2px 7px",
                        borderRadius:T.rPill,
                        background: isAct ? "rgba(255,255,255,0.12)" : compatBg,
                        color: isAct ? "#ccc" : compatColor }}>
                        {r.compat}% совмест.
                      </div>
                    )}
                    {p.rating && (
                      <div style={{ fontSize:11, color: isAct?"#777":"#999", marginTop:4 }}>★ {p.rating}</div>
                    )}
                    {/* Подсказка кликабельности для неактивных */}
                    {!isAct && (
                      <div style={{ fontSize:10, color:T.textMuted, marginTop:5, display:"flex", alignItems:"center", gap:3 }}>
                        Смотреть смету <span style={{ fontSize:11 }}>↓</span>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>

            {/* 2-колоночный лейаут: левая карточка + правая тёмная панель */}
            {/* Единая карточка: таблица + тёмный блок внутри */}
            <div style={{ background:T.bgCard, borderRadius:T.rLg, border:`1px solid ${T.border}`,
              overflow:"hidden", marginBottom:16 }}>

              {/* Шапка карточки */}
              <div style={{ padding:isMobile?"16px 16px 12px":"24px 24px 16px" }}>
                <div style={{ fontSize:13, color:T.textMuted, marginBottom:6 }}>
                  {activeProfile.type === "baseline" ? `Рыночный ориентир ${CONFIG.city}` : activeProfile.subtitle}
                </div>
                <div style={{ display:"flex", alignItems:"baseline", gap:6, flexWrap:"wrap", marginBottom:6 }}>
                  <span style={{ fontSize:13, color:T.textSub }}>от</span>
                  <span style={{ fontSize:isMobile?26:32, fontWeight:900, color:T.text }}>{fmtK(activeResult.gMin)}</span>
                  <span style={{ fontSize:14, color:T.textSub }}>—</span>
                  <span style={{ fontSize:isMobile?26:32, fontWeight:900, color:T.text }}>{fmtK(activeResult.gMax)} ₸</span>
                </div>
                {sel.area && (
                  <div style={{ fontSize:12, color:T.textMuted, marginBottom:12 }}>
                    {Math.round(activeResult.grand / Number(sel.area)).toLocaleString("ru-RU")} ₸/м² · полная итоговая цена
                  </div>
                )}
                <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                  {diff !== 0 && (
                    <span style={{ padding:"5px 12px", borderRadius:T.rPill,
                      background: diff<0 ? T.greenLight : T.redLight,
                      color: diff<0 ? T.greenText : T.red, fontSize:12, fontWeight:700 }}>
                      {diff<0 ? `↓ Дешевле на ${Math.abs(diff)}%` : `↑ Дороже на ${diff}%`}
                    </span>
                  )}
                  {activeProfile.type !== "baseline" && (
                    <span style={{ padding:"5px 12px", borderRadius:T.rPill, fontSize:12, fontWeight:700,
                      background: activeResult.compat>=90?T.greenLight:activeResult.compat>=70?"#FFF8E0":T.redLight,
                      color:      activeResult.compat>=90?T.greenText:activeResult.compat>=70?T.accentText:T.red }}>
                      ◎ Совместимость {activeResult.compat}%
                    </span>
                  )}
                </div>
              </div>

              {/* Таблица разбивки */}
              <div style={{ borderTop:`1px solid ${T.border}`, padding:isMobile?"0 16px":"0 24px" }}>
                {/* Заголовки колонок */}
                <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 0 6px" }}>
                  <div style={{ width:20, flexShrink:0 }}/>
                  <span style={{ flex:1, fontSize:11, fontWeight:700, color:T.textMuted,
                    textTransform:"uppercase", letterSpacing:"0.08em" }}>Этап</span>
                  <span style={{ fontSize:11, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                    letterSpacing:"0.06em", minWidth:70, textAlign:"right" }}>Срок</span>
                  <span style={{ fontSize:11, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                    letterSpacing:"0.06em", minWidth:85, textAlign:"right" }}>Стоимость</span>
                </div>

                {displayStages.map((s, i) => {
                  const it = activeResult.breakdown[s];
                  const avail = it?.available !== false;
                  const dur = calcDuration(s, sel);
                  return (
                    <div key={s} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 0",
                      borderTop:`1px solid ${T.border}` }}>
                      <div style={{ color: avail ? T.textSub : T.textMuted, flexShrink:0, width:20 }}>
                        {STAGE_ICONS[s] || <Ico d="M4 8h8" size={16}/>}
                      </div>
                      <span style={{ flex:1, fontSize:14, color: avail ? T.text : T.textMuted }}>
                        {LABELS[s]}
                      </span>
                      <span style={{ fontSize:12, color:T.textMuted, flexShrink:0, minWidth:70, textAlign:"right" }}>
                        {dur && avail
                          ? (dur.min === dur.max ? `${dur.min} дн.` : `${dur.min}–${dur.max} дн.`)
                          : "—"}
                      </span>
                      <span style={{ fontSize:14, fontWeight:600, color: avail ? T.text : T.textMuted,
                        flexShrink:0, minWidth:85, textAlign:"right" }}>
                        {!it ? "—" : !avail
                          ? <span style={{ fontSize:12, color:T.textMuted, fontStyle:"italic" }}>не выполняет</span>
                          : it.cost > 0 ? fmtK(it.cost)+" ₸" : "—"}
                      </span>
                    </div>
                  );
                })}

                {sel.includeMaterials === "yes" && activeResult.matCost > 0 && (
                  <div style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 0",
                    borderTop:`1px solid ${T.border}` }}>
                    <div style={{ color:T.textMuted, flexShrink:0, width:20 }}>{STAGE_ICONS.materials}</div>
                    <span style={{ flex:1, fontSize:14, color:T.textSub }}>Материалы ~</span>
                    <span style={{ minWidth:70 }}/>
                    <span style={{ fontSize:14, fontWeight:700, color:T.text, minWidth:85, textAlign:"right" }}>
                      ~{fmtK(activeResult.matCost)} ₸
                    </span>
                  </div>
                )}
              </div>

              {/* Тёмный блок внутри карточки */}
              {(() => {
                const totalDur = calcTotalDuration(displayStages, sel);
                return (
                  <div style={{ background:T.bgDark, margin:"0", padding:"20px 24px",
                    position:"relative", overflow:"hidden" }}>
                    <div style={{ position:"absolute", top:-60, right:-60, width:220, height:220,
                      background:"radial-gradient(circle, rgba(245,200,66,0.18) 0%, transparent 65%)",
                      pointerEvents:"none" }}/>

                    <div style={{ display:isMobile?"block":"flex", gap:32, alignItems:"flex-start" }}>
                      {/* Левая часть: диапазон */}
                      <div style={{ flex:1, marginBottom: isMobile?16:0 }}>
                        <div style={{ fontSize:11, color:"rgba(255,255,255,0.45)", textTransform:"uppercase",
                          letterSpacing:"0.08em", marginBottom:8, fontWeight:600 }}>С учётом погрешности ±15%</div>
                        <div style={{ display:"flex", alignItems:"baseline", gap:6, flexWrap:"wrap" }}>
                          <span style={{ fontSize:11, color:"rgba(255,255,255,0.45)" }}>мин</span>
                          <span style={{ fontSize:24, fontWeight:900, color:"#fff" }}>{fmtK(activeResult.gMin)}</span>
                          <span style={{ fontSize:14, color:"rgba(255,255,255,0.4)" }}>—</span>
                          <span style={{ fontSize:24, fontWeight:900, color:T.accent }}>{fmtK(activeResult.gMax)}</span>
                          <span style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>тыс ₸</span>
                        </div>
                      </div>

                      {/* Правая часть: срок */}
                      {totalDur && (
                        <div style={{ flexShrink:0 }}>
                          <div style={{ fontSize:11, color:"rgba(255,255,255,0.45)", textTransform:"uppercase",
                            letterSpacing:"0.08em", marginBottom:8, fontWeight:600 }}>Общий срок</div>
                          <div style={{ display:"flex", alignItems:"baseline", gap:5 }}>
                            <span style={{ fontSize:24, fontWeight:900, color:"#fff" }}>{totalDur.min}</span>
                            <span style={{ fontSize:14, color:"rgba(255,255,255,0.4)" }}>—</span>
                            <span style={{ fontSize:24, fontWeight:900, color:T.accent }}>{totalDur.max}</span>
                            <span style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>раб. дней</span>
                          </div>
                        </div>

                    </div>

                    {activeResult.unavail.length > 0 && (

                  </div>
                );

            </div>

            <div style={{ background:"#FFFDF0", border:`1px solid #E8E0C0`, borderRadius:T.r,
              padding:"14px 18px", marginBottom:18 }}>

    // ═══════════════════════════════════════════════════════════════
    // ФОРМА ЗАЯВКИ
    // ═══════════════════════════════════════════════════════════════
    // Rate-limit: храним время последних отправок в sessionStorage
    const RATE_LIMIT_KEY = "rayo_submit_times";
    const RATE_LIMIT_MAX = 3;   // максимум отправок
    const RATE_LIMIT_WINDOW = 10 * 60 * 1000; // за 10 минут

    function checkRateLimit() {
      return true; // временно отключён для тестирования
    }

    const LeadForm = ({ sel, chosenProfile, onSubmit, onBack }) => {
      const [lead, setLead] = useState({ name:"", phone:"", contact:"whatsapp", timing:"month" });
      const [errors, setErrors] = useState({});
      const [consent, setConsent] = useState(false);
      const [sending, setSending] = useState(false);
      // Honeypot: скрытое поле — боты его заполняют, люди нет

      // Задержка кнопки: активна через 3 сек после загрузки формы
      const [btnReady, setBtnReady] = useState(false);
      const result = calculateTotal(sel, chosenProfile);
      const isMobile = useIsMobile();
      const goMain = () => { window.location.href = INTEGRATIONS.mainSiteUrl; };

      useEffect(() => {
        const t = setTimeout(() => setBtnReady(true), 3000);
        return () => clearTimeout(t);
      }, []);

      const submit = async () => {
        // Honeypot: если заполнено — бот, тихо игнорируем
        if (honeypot) return;

        // Rate limit
        if (!checkRateLimit()) {
          setErrors({ form: "Слишком много попыток. Подождите 10 минут и попробуйте снова." });
          return;
        }

        const e = {};
        if (!lead.name || lead.name.trim().length < 2) e.name = "Введите имя";
        // Валидация телефона: ровно 10–11 цифр, начиная с 7/8/+7
        const digits = lead.phone.replace(/\D/g, "");
        if (!digits || digits.length < 10 || digits.length > 12)
          e.phone = "Введите корректный номер телефона";
        if (!consent) e.consent = "Необходимо согласие на обработку данных";
        if (Object.keys(e).length) { setErrors(e); return; }
        setSending(true);
        const payload = {
          userName:lead.name, userPhone:lead.phone, userContact:lead.contact, userTiming:lead.timing,
          area:sel.area, rooms:sel.rooms, condition:sel.condition,
          calculationScope:sel.calculationScope, selectedStages:sel.selectedStages,
          stageAreas:sel.stageAreas,
          // Демонтаж
          demolition:sel.demolition, wasteRemoval:sel.wasteRemoval,
          // Черновые
          roughItems:sel.roughItems, radiatorCount:sel.radiatorCount,
          // Электрика
          electricType:sel.electricType, electricGrooving:sel.electricGrooving, electricAge:sel.electricAge,
          electricOutlets:sel.electricOutlets, electricSwitches:sel.electricSwitches, electricLights:sel.electricLights,
          // Сантехника
          plumbing:sel.plumbing, plumbingLocation:sel.plumbingLocation, plumbingMeters:sel.plumbingMeters,
          // Санузел
          bathroomType:sel.bathroomType, bathroomCount:sel.bathroomCount,
          bathroomFixtureType:sel.bathroomFixtureType,
          // Прочие этапы
          kitchen:sel.kitchen, ceiling:sel.ceiling,
          floorCovering:sel.floorCovering, floorLeveling:sel.floorLeveling,
          walls:sel.walls, wallLeveling:sel.wallLeveling,
          includeMaterials:sel.includeMaterials,
          selectedProfileId:chosenProfile.id, selectedProfileName:chosenProfile.name,
          totalMin:result.gMin, totalMax:result.gMax, compatibility:result.compat,
          unavailableStages:result.unavail,
          source:"rayo_calculator", calculatedAt:new Date().toISOString(),
        };
        console.log("LEAD:", payload);
        await Promise.allSettled([
          sendToTelegram(lead, sel, result, chosenProfile),
          sendToWebhook(payload),
          sendToGoogleSheets(payload),
          sendEmail(payload),
        ]);
        setSending(false);
        onSubmit(payload);
      };

      return (
        <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
          <TopBar showBack onBack={onBack} onLogoClick={goMain} total={0}/>
          <div style={{ maxWidth:800, margin:"0 auto", padding: isMobile?"16px 16px 80px":"28px 24px 80px",
            display: isMobile?"block":"grid", gridTemplateColumns:"1fr 280px", gap:28 }} className="rayo-anim">

            <div style={{ background:T.bgCard, borderRadius:T.rLg, padding:isMobile?"20px":"28px",
              border:`1px solid ${T.border}` }}>
              <StepLabel label="Заявка"/>
              <h1 style={{ fontSize:26, fontWeight:800, color:T.text, marginBottom:6, letterSpacing:-0.4 }}>Оставьте контакты</h1>
              <p style={{ fontSize:14, color:T.textSub, marginBottom:24, lineHeight:1.6 }}>

              <input
                tabIndex={-1}

                onChange={e => setHoneypot(e.target.value)}

              {errors.form && (
                <div style={{ background:T.redLight, border:`1px solid ${T.red}`, borderRadius:T.r,

                  {errors.form}
                </div>
              )}

              {[["name","Ваше имя *","Иван","text"],["phone","Телефон *","+7 (___) ___ __ __","tel"]].map(([k,l,ph,t]) => (
                <div key={k} style={{ marginBottom:16 }}>
                  <label style={{ fontSize:13, fontWeight:600, color:T.textSub, display:"block", marginBottom:6 }}>{l}</label>
                  <input style={{ width:"100%", padding:"12px 14px", borderRadius:T.r,
                    border:`1.5px solid ${errors[k]?T.red:T.border}`, fontSize:15,
                    outline:"none", background:T.bgPage, color:T.text }}
                    type={t} placeholder={ph} value={lead[k]}
                    onChange={e => setLead(x => ({...x,[k]:e.target.value}))}/>
                  {errors[k] && <div style={{ fontSize:12, color:T.red, marginTop:4 }}>{errors[k]}</div>}
                </div>
              ))}

              <label style={{ fontSize:13, fontWeight:600, color:T.textSub, display:"block", marginBottom:8 }}>
                Удобный способ связи
              </label>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:18 }}>
                {[["whatsapp","WhatsApp"],["telegram","Telegram"],["call","Звонок"]].map(([v,l]) => (
                  <button key={v} onClick={() => setLead(x => ({...x,contact:v}))} style={{
