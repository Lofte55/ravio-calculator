              </label>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:22 }}>
                {[["asap","Как можно скорее"],["month","В течение месяца"],
                  ["quarter","В этом квартале"],["planning","Пока планирую"]].map(([v,l]) => (
                <button key={v} onClick={() => setLead(x => ({...x,timing:v}))} style={{
                  padding:"11px 12px", borderRadius:T.r, fontSize:13, fontWeight:500,
                  cursor:"pointer", textAlign:"left",
                  border:`1.5px solid ${lead.timing===v?T.text:T.border}`,
                  background: lead.timing===v ? T.text : T.bgCard,
                  color: lead.timing===v ? T.white : T.text,
                }}>{l}</button>
                ))}
              </div>

              <label style={{ display:"flex", gap:10, alignItems:"flex-start",
                cursor:"pointer", marginBottom: errors.consent ? 4 : 18 }}>
                <input type="checkbox" checked={consent} onChange={e => setConsent(e.target.checked)}
                  style={{ marginTop:2, accentColor:T.accent, width:16, height:16, flexShrink:0 }}/>
                <span style={{ fontSize:12, color:T.textSub, lineHeight:1.55 }}>
                  Нажимая «Отправить», вы соглашаетесь на обработку персональных данных
                  в соответствии с{" "}
                  <a href="#" style={{ color:T.accent, textDecoration:"underline" }}>
                    Политикой конфиденциальности
                  </a>
                </span>
              </label>
              {errors.consent && (
                <div style={{ fontSize:12, color:T.red, marginBottom:14 }}>{errors.consent}</div>
              )}

              <Btn onClick={submit} disabled={sending || !btnReady}>
                {sending ? (
                  <span style={{ display:"flex", alignItems:"center", gap:10, justifyContent:"center" }}>
                    <span className="rayo-spinner"/>
                    Отправляем...
                  </span>
                ) : !btnReady ? (
                  <span style={{ display:"flex", alignItems:"center", gap:10, justifyContent:"center" }}>
                    <span className="rayo-spinner"/>
                    Загрузка...
                  </span>
                ) : "Отправить заявку →"}
              </Btn>
              <button onClick={onBack} style={{ display:"block", width:"100%", textAlign:"center",
                marginTop:12, fontSize:13, color:T.textSub, background:"none", border:"none",
                cursor:"pointer" }}>← Назад к смете</button>
            </div>

            <div>
              <div style={{ background:T.bgDark, borderRadius:T.rLg, padding:20, marginBottom: isMobile?16:0 }}>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.45)", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>
                  Ваш расчёт
                </div>
                <div style={{ fontSize:14, fontWeight:700, color:T.accent, marginBottom:6 }}>{chosenProfile.name}</div>
                <div style={{ display:"flex", alignItems:"baseline", gap:5, flexWrap:"wrap" }}>
                  <span style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>от</span>
                  <span style={{ fontSize:20, fontWeight:900, color:"#fff" }}>{fmtK(result.gMin)}</span>
                  <span style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>до</span>
                  <span style={{ fontSize:20, fontWeight:900, color:T.accent }}>{fmtK(result.gMax)} ₸</span>
                </div>
                <div style={{ borderTop:"1px solid #252A34", paddingTop:12, marginTop:12,
                  display:"flex", flexDirection:"column", gap:6 }}>
                  {[["Объект", `${sel.area} м² · ${sel.rooms}-комн.`],
                    ["Этапов", sel.selectedStages.length],
                    ["Совместимость", calculateTotal(sel,chosenProfile).compat+"%"]].map(([k,v])=>(
                    <div key={k} style={{ display:"flex", justifyContent:"space-between" }}>
                      <span style={{ fontSize:12, color:"rgba(255,255,255,0.45)" }}>{k}</span>
                      <span style={{ fontSize:12, color:"#aaa", fontWeight:600 }}>{v}</span>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.45)", marginTop:12, lineHeight:1.5 }}>
                  ⓘ Подрядчик получит полную смету и свяжется в течение дня
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // ЭКРАН УСПЕХА
    // ═══════════════════════════════════════════════════════════════
    const SuccessScreen = ({ sel, chosen, leadPayload, onReset }) => {
      const r = chosen ? calculateTotal(sel, chosen) : null;
      const goMain = () => { window.location.href = INTEGRATIONS.mainSiteUrl; };
      return (
        <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
          <TopBar showBack={false} total={0} onLogoClick={goMain}/>
          <div style={{ maxWidth:520, margin:"0 auto", padding:"40px 20px 80px" }} className="rayo-anim">
            <div style={{ background:T.bgCard, borderRadius:T.rLg, padding:"44px 28px",
              textAlign:"center", border:`1px solid ${T.border}` }}>
              <div style={{ width:56, height:56, borderRadius:"50%", background:T.accent,
                display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 20px" }}>
                <Ico d="M14 4L7 13l-4-4" size={24} stroke={T.text} sw="2.5"/>
              </div>
              <h1 style={{ fontSize:22, fontWeight:800, color:T.text, marginBottom:10 }}>Заявка отправлена</h1>
              <p style={{ fontSize:14, color:T.textSub, marginBottom:24, lineHeight:1.6 }}>
                Подрядчик получил вашу смету и свяжется в течение рабочего дня.
              </p>

              {r && chosen && (
                <div style={{ background:T.bgDark, borderRadius:T.r, padding:"16px 20px", marginBottom:24 }}>
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.45)", textTransform:"uppercase",
                    letterSpacing:"0.08em", marginBottom:6 }}>
                    ВАШ РАСЧЁТ · {chosen.name.toUpperCase()}
                  </div>
                  <div style={{ display:"flex", alignItems:"baseline", gap:5, justifyContent:"center", flexWrap:"wrap" }}>
                    <span style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>от</span>
                    <span style={{ fontSize:22, fontWeight:900, color:"#fff" }}>{fmtK(r.gMin)}</span>
                    <span style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>до</span>
                    <span style={{ fontSize:22, fontWeight:900, color:T.accent }}>{fmtK(r.gMax)} ₸</span>
                  </div>
                </div>
              )}

              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                <BtnOutline onClick={goMain}>На главную</BtnOutline>
                <BtnOutline onClick={onReset}>Начать сначала</BtnOutline>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // ГЛАВНЫЙ КОМПОНЕНТ
    // ═══════════════════════════════════════════════════════════════
    function RayoCalculator() {
      const [gStep, setGStep]     = useState("scope");
      const [sel, setSel]         = useState({...INIT_SEL});
      const [microSteps, setMicroSteps] = useState([]);
      const [microIdx, setMicroIdx]     = useState(0);
      const [ranked, setRanked]         = useState([]);
      const [chosen, setChosen]         = useState(null);
      const [errors, setErrors]         = useState({});
      const [leadPayload, setLeadPayload] = useState(null);
      const [animKey, setAnimKey]         = useState(0);
      const isMobile = useIsMobile();
      useStyles();

      const goStep = useCallback((step) => {
        setAnimKey(k => k + 1);
        setGStep(step);
      }, []);

      const upd = useCallback((k, v) => setSel(p => ({...p, [k]:v})), []);
      const updArea = (stage, v) => setSel(p => ({...p, stageAreas:{...(p.stageAreas||{}),[stage]:v}}));
      const toggleStage = s => setSel(p => {
        const cur = p.selectedStages;
        return {...p, selectedStages: cur.includes(s) ? cur.filter(x=>x!==s) : [...cur, s]};
      });

      const liveResult = (gStep !== "scope" && sel.calculationScope)
        ? calculateTotal(sel, CONFIG.independent) : null;

      const goScope = scope => {
        upd("calculationScope", scope);
        setTimeout(() => {
          if (scope !== "selected_stages") {
            const def = PATH_DEFAULTS[scope];
            setSel(p => ({...p, calculationScope:scope, selectedStages:def.stages, ...def.sel}));
          } else {
            setSel(p => ({...p, calculationScope:scope}));
          }
          setAnimKey(k=>k+1); setGStep("area");
        }, 200);
      };

      const goCondition = c => {
        upd("condition", c);
        setTimeout(() => {
          const stages = sel.calculationScope === "selected_stages"
            ? sel.selectedStages : (PATH_DEFAULTS[sel.calculationScope]?.stages || []);
          setMicroSteps(buildMicroSteps(stages));
          setMicroIdx(0); setAnimKey(k=>k+1); setGStep("micro");
        }, 200);
      };

      const [resultLoading, setResultLoading] = useState(false);
      const [editingArea, setEditingArea]     = useState(false);
      const finishMicro = () => {
        setResultLoading(true);
        setTimeout(() => {
          setRanked(rankContractors(CONFIG.contractors, sel.selectedStages));
          setAnimKey(k=>k+1);
          setResultLoading(false);
          setGStep("result");
        }, 1200);
      };
      const goNextMicro = () => {
        setAnimKey(k=>k+1);
        if (microIdx < microSteps.length - 1) setMicroIdx(i => i+1);
        else finishMicro();
      };
      const goPrevMicro = () => {
        setAnimKey(k=>k+1);
        if (microIdx === 0) { setGStep("condition"); }
        else setMicroIdx(i => i-1);
      };

      const validateArea = () => {
        const n = Number(sel.area);
        if (!sel.area || n < 10 || n > 300) { setErrors({area:"Укажите от 10 до 300 м²"}); return false; }
        setErrors({}); return true;
      };
      const reset = () => {
        setSel({...INIT_SEL}); setGStep("scope"); setChosen(null);
        setErrors({}); setRanked([]); setLeadPayload(null); setAnimKey(k=>k+1);
      };

      const totalSteps = sel.calculationScope === "selected_stages" ? 6 : 5;
      const stepNum = { scope:0, area:1, rooms:2, stages:3,
        condition: sel.calculationScope === "selected_stages" ? 4 : 3, micro:totalSteps }[gStep] || 0;
      const currentMicroStage = microSteps[microIdx];
      const goMain = () => { window.location.href = INTEGRATIONS.mainSiteUrl; };

      // Прогресс-бар: единый счётчик по всему wizard
      const preSteps = sel.calculationScope === "selected_stages" ? 4 : 3; // шаги до micro
      const totalReal = preSteps + (microSteps.length || 5);
      const wizardProgress = (() => {
        if (gStep === "scope")     return 0;
        if (gStep === "area")      return Math.round(1 / totalReal * 100);
        if (gStep === "rooms")     return Math.round(2 / totalReal * 100);
        if (gStep === "stages")    return Math.round(3 / totalReal * 100);
        if (gStep === "condition") return Math.round((preSteps - 1) / totalReal * 100);
        if (gStep === "micro")     return Math.round((preSteps + microIdx) / totalReal * 100);
        return null;
      })();

      // Прелоадер перед экраном результата
      if (resultLoading) return (
        <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font,
          display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:24 }}>
          <div style={{ position:"relative", width:72, height:72 }}>
            <div style={{ position:"absolute", inset:0, border:"3px solid #E8E6E0", borderRadius:"50%" }}/>
            <div style={{ position:"absolute", inset:0, border:"3px solid transparent",
              borderTopColor:T.accent, borderRadius:"50%", animation:"spin 0.8s linear infinite" }}/>
            <div style={{ position:"absolute", inset:8, borderRadius:"50%", overflow:"hidden",
              display:"flex", alignItems:"center", justifyContent:"center", background:"#fff" }}>
              <img src="favicon.svg" alt="RAVIO" style={{ width:40, height:40 }}/>
            </div>
          </div>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:16, fontWeight:700, color:T.text, marginBottom:6 }}>Считаем вашу смету</div>
            <div style={{ fontSize:13, color:T.textMuted }}>Подбираем подрядчиков Павлодара…</div>
          </div>
        </div>
      );

      if (gStep === "result") return (
        <ResultScreen sel={sel} rankedContractors={ranked}
          onChoose={p => { setChosen(p); setAnimKey(k=>k+1); setGStep("lead"); }}
          onBack={() => { setMicroIdx(microSteps.length-1); setAnimKey(k=>k+1); setGStep("micro"); }}
          onReset={reset}/>
      );
      if (gStep === "lead" && chosen) return (
        <LeadForm sel={sel} chosenProfile={chosen}
          onSubmit={p => { setLeadPayload(p); setAnimKey(k=>k+1); setGStep("success"); }}
          onBack={() => { setAnimKey(k=>k+1); setGStep("result"); }}/>
      );
      if (gStep === "success") return (
        <SuccessScreen sel={sel} chosen={chosen} leadPayload={leadPayload} onReset={reset}/>
      );

      const onBack = () => {
        setAnimKey(k=>k+1);
        if (gStep === "scope") return;
        if (gStep === "area") setGStep("scope");
        else if (gStep === "rooms") setGStep("area");
        else if (gStep === "stages") setGStep("rooms");
        else if (gStep === "condition") setGStep(sel.calculationScope === "selected_stages" ? "stages" : "rooms");
        else if (gStep === "micro") goPrevMicro();
        else setGStep("scope");
      };

      const WizHeader = () => gStep === "scope"
        ? (
          <div style={{ background:T.bgCard, boxShadow:"0 1px 0 0 #E8E6E0", position:"sticky", top:0, zIndex:50 }}>
            <div style={{ maxWidth:960, margin:"0 auto", padding:"0 24px",
              display:"flex", alignItems:"center", justifyContent:"center", height:60 }}>
              <Logo onClick={goMain}/>
            </div>
          </div>
        ) : (
          <TopBar step={stepNum} total={totalSteps} onBack={onBack} onLogoClick={goMain} progress={wizardProgress}/>
        );

      // ШАГ 0: ВЫБОР ПУТИ
      if (gStep === "scope") return (
        <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
          <WizHeader/>
          <div style={{ maxWidth:960, margin:"0 auto", padding: isMobile?"24px 16px 80px":"48px 24px 80px" }}
            key={animKey} className="rayo-anim">

            <h1 style={{ fontSize:isMobile?28:42, fontWeight:900, color:T.text, marginBottom:12,
              lineHeight:1.12, letterSpacing:-1 }}>
              Сколько стоит ремонт<br/>вашей квартиры?
            </h1>
            <p style={{ fontSize:isMobile?14:16, color:T.textSub, marginBottom:16, lineHeight:1.65, maxWidth:520 }}>
              Ответьте на несколько вопросов — получите ориентир по цене и увидите реальных подрядчиков Павлодара.
            </p>
            <div style={{ fontSize:13, color:T.textMuted, marginBottom:32, display:"flex", alignItems:"center", gap:6 }}>
              <span style={{ width:7, height:7, borderRadius:"50%", background:T.accent, display:"inline-block", flexShrink:0 }}/>
              {CONFIG.localEstimatesCount.toLocaleString("ru-RU")} смет составлено в Павлодаре · {currentMonth}
            </div>

            <div style={{ display:"grid", gridTemplateColumns: isMobile?"1fr":"1fr 1fr 1fr", gap:16, marginBottom:28 }}>
              {[
                { val:"full_repair",     time:"~2 мин",  title:"Полный ремонт квартиры",      sub:"Всё — от демонтажа до чистовой отделки",         recommended:false },
                { val:"selected_stages", time:"~3 мин",  title:"Отдельные комнаты или зоны",  sub:"Только кухня, санузел, полы или другое",          recommended:false },
                { val:"not_sure",        time:"~2 мин",  title:"Не знаю с чего начать",       sub:"Покажем ориентир — потом уточним детали",         recommended:true },
              ].map(({ val, time, title, sub, recommended }) => {
                const active = sel.calculationScope === val;
                return (
                  <button key={val} className="rayo-scope-card"
                    onClick={() => { setSel(p=>({...p, calculationScope:val})); setTimeout(()=>goScope(val), 160); }}
                    style={{ display:"flex", flexDirection:"column", background: active ? T.text : T.bgCard,
                      border:`1.5px solid ${active ? T.text : T.border}`,
                      borderRadius:T.rLg, cursor:"pointer", padding:0, overflow:"hidden",
                      textAlign:"left", position:"relative",
                      boxShadow: active ? "none" : "0 2px 8px rgba(0,0,0,0.06)" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                      padding:"20px 20px 12px" }}>
                      <div style={{ width:44, height:44, borderRadius:12,
                        background: active ? T.accent : "#F2F0EA",
                        display:"flex", alignItems:"center", justifyContent:"center",
                        color: active ? T.text : T.textSub, fontSize:20 }}>
                        {SCOPE_ICONS[val]}
                      </div>
                      <span style={{ fontSize:11, fontWeight:700, color: active?"#888":T.textMuted,
                        textTransform:"uppercase", letterSpacing:"0.08em",
                        background: active?"rgba(255,255,255,0.1)":"#F2F0EA",
                        padding:"4px 10px", borderRadius:T.rPill }}>{time}</span>
                    </div>
                    <div style={{ padding:"0 20px 22px", flex:1, display:"flex", flexDirection:"column" }}>
                      <div style={{ fontSize:16, fontWeight:800, color: active?T.white:T.text,
                        marginBottom:8, lineHeight:1.25, letterSpacing:-0.3 }}>{title}</div>
                      <div style={{ fontSize:14, color: active?"rgba(255,255,255,0.6)":T.textSub, lineHeight:1.55,
                        marginBottom:"auto", paddingBottom:16 }}>{sub}</div>
                      <div style={{ fontSize:13, fontWeight:700, color: active?T.accent:T.text,
                        display:"flex", alignItems:"center", gap:4 }}>
                        Начать <span style={{ fontSize:16 }}>→</span>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>

            <div style={{ fontSize:12, color:T.textMuted, display:"flex", alignItems:"center", gap:6 }}>
              <Ico d="M8 14A6 6 0 108 2a6 6 0 000 12zm-1-7h2v4H7zm0-2h2v1H7z" size={14} stroke={T.textMuted}/>
              Ваши данные не передаются третьим лицам без согласия
            </div>
          </div>
        </div>
      );

      // ШАГ 1: ПЛОЩАДЬ
      if (gStep === "area") {
        const areaVal = Number(sel.area) || 50;
        const progress = ((Math.min(areaVal,200) - 15) / (200 - 15) * 100).toFixed(1) + "%";
        return (
          <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
            <WizHeader/>
            <WizardWrap sel={sel} liveResult={liveResult} isMobile={isMobile} animKey={animKey}>
              <StepLabel label="Шаг 1 · Площадь"/>
              <h1 style={{ fontSize:isMobile?28:34, fontWeight:800, color:T.text, marginBottom:8, letterSpacing:-0.5 }}>
                Какая площадь квартиры?
              </h1>
              <p style={{ fontSize:14, color:T.textSub, marginBottom:22, lineHeight:1.6 }}>
                Можно указать примерно — диапазон уточнится на следующих шагах.
              </p>
              <div style={{ background:T.bgCard, borderRadius:T.rLg, padding:isMobile?"20px":"28px",
                border:`1.5px solid ${T.border}` }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:24 }}>
                  <div style={{ display:"flex", alignItems:"baseline", gap:6 }}>
                    {editingArea ? (
                      <input
                        autoFocus
                        type="number" min="10" max="300"
                        value={sel.area}
                        onChange={e => upd("area", e.target.value)}
                        onBlur={() => setEditingArea(false)}
                        onKeyDown={e => e.key === "Enter" && setEditingArea(false)}
                        style={{ fontSize:isMobile?48:60, fontWeight:800, color:T.text, width:160,
                          border:"none", borderBottom:`2px solid ${T.accent}`, background:"transparent",
                          outline:"none", letterSpacing:-2, lineHeight:1 }}
                      />
                    ) : (
                      <span
                        onClick={() => setEditingArea(true)}
                        title="Нажмите для ввода вручную"
                        style={{ fontSize:isMobile?52:64, fontWeight:800, color:T.text, lineHeight:1,
                          letterSpacing:-2, cursor:"text", borderBottom:`2px dashed ${T.border}` }}>
                        {sel.area||"—"}
                      </span>
                    )}
                    <span style={{ fontSize:20, color:T.textSub, fontWeight:500 }}>м²</span>
                  </div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap", justifyContent:"flex-end" }}>
                    {[36,56,78,100].map(v => {
                      const active = Number(sel.area) === v;
                      return (
                        <button key={v} onClick={() => upd("area", String(v))} style={{
                          width:42, height:42, borderRadius:"50%", border:"none",
                          background: active ? T.text : "#F2F0EA",
                          color: active ? T.accent : T.textSub,
                          fontSize:13, fontWeight:700, cursor:"pointer", transition:"all .15s",
                        }}>{v}</button>
                      );
                    })}
                  </div>
                </div>
                <div style={{ position:"relative", marginBottom:6 }}>
                  <div style={{
                    position:"absolute", top:"50%", left:0, right:0,
                    height:4, borderRadius:2, transform:"translateY(-50%)",
                    background:`linear-gradient(to right, ${T.accent} ${progress}, #D4D0C8 ${progress})`,
                    pointerEvents:"none",
                  }}/>
                  <input type="range" min={15} max={200} step={1} value={areaVal}
                    onChange={e => upd("area", e.target.value)}
                    style={{ width:"100%", position:"relative", zIndex:1,
                      background:"transparent", height:22, cursor:"pointer" }}/>
                </div>
                <div style={{ display:"flex", justifyContent:"space-between",
                  fontSize:11, color:T.textMuted, marginBottom:20 }}>
                  <span>15 м²</span><span>200 м²</span>
                </div>
                {errors.area && <div style={{ fontSize:12, color:T.red, marginBottom:10 }}>{errors.area}</div>}
                <Btn onClick={() => { if(validateArea()) { setAnimKey(k=>k+1); setGStep("rooms"); } }}>
                  Дальше →
                </Btn>
              </div>
            </WizardWrap>
          </div>
        );
      }

      // ШАГ 2: КОМНАТЫ
      if (gStep === "rooms") return (
        <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
          <WizHeader/>
          <WizardWrap sel={sel} liveResult={liveResult} isMobile={isMobile} animKey={animKey}>
            <StepLabel label="Шаг 2 · Тип квартиры"/>
            <h1 style={{ fontSize:isMobile?28:34, fontWeight:800, color:T.text, marginBottom:8, letterSpacing:-0.5 }}>Сколько комнат?</h1>
            <p style={{ fontSize:14, color:T.textSub, marginBottom:22, lineHeight:1.6 }}>Один тап — переход к следующему шагу.</p>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              {[["1","1 комната"],["2","2 комнаты"],["3","3 комнаты"],["4+","4 и более"]].map(([val,label]) => (
                <button key={val} onClick={() => {
                  upd("rooms", val);
                  setTimeout(() => { setAnimKey(k=>k+1); setGStep(sel.calculationScope==="selected_stages"?"stages":"condition"); }, 180);
                }} className="rayo-scope-card" style={{
                  padding:"24px 12px", borderRadius:T.r, textAlign:"center", cursor:"pointer",
                  border:`1.5px solid ${sel.rooms===val?T.text:T.border}`,
                  background: sel.rooms===val?T.text:T.bgCard,
                }}>
                  <div style={{ fontSize:36, fontWeight:800, color:sel.rooms===val?T.accent:T.text, letterSpacing:-1 }}>{val}</div>
                  <div style={{ fontSize:13, color:sel.rooms===val?"#7A8099":T.textSub, marginTop:5, fontWeight:500 }}>{label}</div>
                </button>
              ))}
            </div>
          </WizardWrap>
        </div>
      );

      // ШАГ 3: ВЫБОР ЭТАПОВ (только selected_stages)
      if (gStep === "stages") return (
        <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
          <WizHeader/>
          <WizardWrap sel={sel} liveResult={liveResult} isMobile={isMobile} animKey={animKey}>
            <StepLabel label="Шаг 3 · Выбор этапов"/>
            <h1 style={{ fontSize:isMobile?28:34, fontWeight:800, color:T.text, marginBottom:8, letterSpacing:-0.5 }}>
              Какие этапы вам нужны?
            </h1>
            <p style={{ fontSize:14, color:T.textSub, marginBottom:22, lineHeight:1.6 }}>
              Можно выбрать несколько. Кнопка «Дальше» появится после выбора.
            </p>
            <div style={{ display:"grid", gridTemplateColumns: isMobile?"1fr 1fr":"1fr 1fr 1fr", gap:8, marginBottom:16 }}>
              {STAGE_ORDER.map(s => (
                <StagePill key={s} label={LABELS[s]} icon={STAGE_ICONS[s]}
                  selected={sel.selectedStages.includes(s)} onClick={() => toggleStage(s)}/>
              ))}
            </div>
            {errors.stages && <div style={{ fontSize:12, color:T.red, marginBottom:10 }}>{errors.stages}</div>}
            <Btn
              disabled={sel.selectedStages.length === 0}
              onClick={() => {
                if (!sel.selectedStages.length) { setErrors({stages:"Выберите хотя бы один"}); return; }
                setErrors({}); setAnimKey(k=>k+1); setGStep("condition");
              }}
              style={{ opacity: sel.selectedStages.length > 0 ? 1 : 0.5 }}>
              {sel.selectedStages.length > 0
                ? `Дальше · выбрано ${sel.selectedStages.length} →`
                : "Выберите хотя бы один этап →"}
            </Btn>
          </WizardWrap>
        </div>
      );

      // ШАГ 3/4: СОСТОЯНИЕ КВАРТИРЫ
      if (gStep === "condition") return (
        <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
          <WizHeader/>
          <WizardWrap sel={sel} liveResult={liveResult} isMobile={isMobile} animKey={animKey}>
            <StepLabel label={`Шаг ${sel.calculationScope==="selected_stages"?4:3} · Состояние`}/>
            <h1 style={{ fontSize:isMobile?28:34, fontWeight:800, color:T.text, marginBottom:8, letterSpacing:-0.5 }}>
              В каком состоянии квартира?
            </h1>
            <p style={{ fontSize:14, color:T.textSub, marginBottom:22, lineHeight:1.6 }}>
              Влияет на коэффициент сложности и объём подготовительных работ.
            </p>
            {[
              ["new_building",    "Новостройка без отделки",         "Чистовая отделка с нуля"],
              ["secondary_normal","Вторичка в норм. состоянии",      "Жилая, без явных проблем"],
              ["old_full_repair", "Старая квартира под ремонт",      "Повышенная сложность работ"],
              ["very_bad",        "Убитое состояние",                "Максимальный объём подготовки"],
            ].map(([val,title,sub]) => (
              <OptionRow key={val} icon={COND_ICONS[val]} title={title} sub={sub}
                onClick={() => goCondition(val)} active={sel.condition===val}/>
            ))}
          </WizardWrap>
        </div>
      );

      // ШАГ 5: МИКРО-ШАГИ
      if (gStep === "micro") {
        const stage = currentMicroStage;
        const sa = sel.stageAreas || {};

        const Nav = () => (
          <div style={{ marginTop:22 }}>
            <div style={{ display:"flex", gap:10, marginBottom:10 }}>
              <BtnGhost onClick={goPrevMicro} style={{ flexShrink:0, padding:"12px 20px" }}>← Назад</BtnGhost>
              <Btn onClick={goNextMicro} style={{ flex:1 }}>
                {microIdx < microSteps.length-1 ? "Дальше →" : "Показать расчёт →"}
              </Btn>
            </div>
            {microIdx < microSteps.length-1 && (
              <button onClick={goNextMicro} style={{ display:"block", width:"100%", textAlign:"center",
                fontSize:13, color:T.textMuted, background:"none", border:"none", cursor:"pointer",
                textDecoration:"underline", textUnderlineOffset:2 }}>
                Пропустить шаг
              </button>
            )}
          </div>
        );

        return (
          <div style={{ minHeight:"100vh", background:T.bgPage, fontFamily:T.font }}>
            <WizHeader/>
            <WizardWrap sel={sel} liveResult={liveResult} isMobile={isMobile} animKey={animKey}>
              <MiniProg current={microIdx} total={microSteps.length}/>

              {stage === "materials" && (<>
                <StageHeader icon={STAGE_ICONS.materials} title="Материалы" subtitle="Ориентировочно ~37% от стоимости работ"/>
                <OptionRow icon="✓" title="Да, показать с материалами" sub="Более реалистичная оценка"
                  onClick={()=>upd("includeMaterials","yes")} active={sel.includeMaterials==="yes"}/>
                <OptionRow icon="✕" title="Только стоимость работ" sub=""
                  onClick={()=>upd("includeMaterials","no")} active={sel.includeMaterials==="no"}/>
                <Nav/>
              </>)}

              {stage === "roughWorks" && (<>
                <StageHeader icon={STAGE_ICONS.roughWorks} title="Черновые работы"
                  subtitle="Подготовительный этап — часто самый дорогой"/>
                <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                  letterSpacing:"0.06em", marginBottom:10 }}>Что нужно сделать?</div>
                <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:14 }}>
                  {[
                    ["plastering",    "Штукатурка стен",  "Выравнивание под отделку",              "M2 4h12v2H2zm0 4h12v2H2zm0 4h8v2H2z"],
                    ["screed",        "Стяжка пола",      "Цементная основа под покрытие",         "M2 12h12M3 9l2-5h6l2 5M6 4V2m4 2V2"],
                    ["selfLeveling",  "Наливной пол",     "Финишный слой выравнивания",            "M2 10c2-3 4-3 6 0s4 3 6 0M2 13h12"],
                    ["radiators",     "Замена батарей",   "Радиаторы отопления",                   "M4 2v12M7 2v12M10 2v12M13 2v12M2 5h12M2 11h12"],
                    ["soundproofing", "Звукоизоляция",    "Стены, пол или потолок",                "M4 8a4 4 0 008 0M1.5 8a6.5 6.5 0 0013 0"],
                  ].map(([v, t, s, iconD]) => {
                    const active = (sel.roughItems||[]).includes(v);
                    return (
                      <button key={v} onClick={() => {
                        const cur = sel.roughItems || [];
                        upd("roughItems", cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v]);
                      }} data-active={active} className="rayo-stage-pill" style={{
                        display:"flex", alignItems:"center", gap:10, padding:"12px 14px",
                        borderRadius:T.r, border:`1.5px solid ${active ? T.text : T.border}`,
                        background: active ? T.text : T.bgCard, cursor:"pointer", textAlign:"left", width:"100%",
                      }}>
                        <div style={{ width:32, height:32, borderRadius:8, flexShrink:0,
                          background: active ? T.accent : "#F2F0EA",
                          display:"flex", alignItems:"center", justifyContent:"center",
                          color: active ? T.text : T.textSub }}>
                          <Ico d={iconD}/>
                        </div>
                        <div style={{ flex:1 }}>
                          <div style={{ fontSize:13, fontWeight: active ? 700 : 500, color: active ? T.white : T.text }}>{t}</div>
                          <div style={{ fontSize:11, color: active ? "rgba(255,255,255,0.5)" : T.textMuted, marginTop:1 }}>{s}</div>
                        </div>
                        {active && (
                          <div style={{ width:20, height:20, borderRadius:"50%", background:T.accent, flexShrink:0,
                            display:"flex", alignItems:"center", justifyContent:"center" }}>
                            <Ico d="M5 9.5l3 3 5-5" size={11} stroke={T.text} sw="2"/>
                          </div>
                        )}
                      </button>
                    );
                  })}
                </div>
                {(sel.roughItems||[]).includes("radiators") && (
                  <div style={{ background:T.bgCard, border:`1px solid ${T.border}`, borderRadius:T.r,
                    padding:"14px 16px", marginBottom:8 }}>
                    <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                      letterSpacing:"0.06em", marginBottom:10 }}>Сколько радиаторов заменить?</div>
                    <NumInput label="Радиаторы" value={sel.radiatorCount}
                      onChange={v=>upd("radiatorCount",v)} suffix="шт"/>
                    <div style={{ fontSize:11, color:T.textMuted, marginTop:8 }}>
                      ~{CONFIG.independent.prices.radiatorUnit.toLocaleString("ru-RU")} ₸/шт — только монтаж без стоимости радиатора
                    </div>
                  </div>
                )}
                <Nav/>
              </>)}

              {stage === "demolition" && (<>
                <StageHeader icon={STAGE_ICONS.demolition} title="Демонтаж" subtitle="Что нужно разобрать перед ремонтом?"/>
                {[["none","Не нужен",""],["light","Лёгкий","Снять плитку, обои, плинтуса"],
                  ["medium","Средний","Убрать перегородки, стяжку"],["full","Полный","До бетона"]].map(([v,t,s])=>(
                  <OptionRow key={v} icon={STAGE_ICONS.demolition} title={t} sub={s}
                    onClick={()=>upd("demolition",v)} active={sel.demolition===v}/>
                ))}
                <Nav/>
              </>)}

              {stage === "wasteRemoval" && (<>
                <StageHeader icon={STAGE_ICONS.wasteRemoval} title="Вывоз мусора" subtitle={`Фиксированная стоимость: ${fmt(CONFIG.independent.prices.wasteRemovalFixed)}`}/>
                <OptionRow icon="✓" title="Да, нужен" sub="Вывоз и утилизация строительного мусора"
                  onClick={()=>upd("wasteRemoval","yes")} active={sel.wasteRemoval==="yes"}/>
                <OptionRow icon="✕" title="Нет, справимся сами" sub=""
                  onClick={()=>upd("wasteRemoval","no")} active={sel.wasteRemoval==="no"}/>
                <Nav/>
              </>)}

              {stage === "electric" && (<>
                <StageHeader icon={STAGE_ICONS.electric} title="Электрика" subtitle="Проводка, розетки, щиток."/>

                {/* Объём замены */}
                <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>Объём работ</div>
                {[
                  ["none",    "Не трогаем",         "Оставляем как есть"],
                  ["partial", "Частичная замена",    "Добавить линии, заменить часть"],
                  ["full",    "Полная замена",        "От щитка до каждой точки"],
                ].map(([v,t,s])=>(
                  <OptionRow key={v} icon={STAGE_ICONS.electric} title={t} sub={s}
                    onClick={()=>upd("electricType",v)} active={sel.electricType===v}/>
                ))}

                {sel.electricType !== "none" && sel.electricType !== "" && (<>
                  {/* Штрабление */}
                  <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", margin:"14px 0 8px" }}>Штрабление стен</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14 }}>
                    {[["no","Без штрабления","Открытая или в кабель-каналах"],["yes","Штрабление стен","Скрытая проводка в штробах"]].map(([v,t,s])=>(
                      <button key={v} onClick={()=>upd("electricGrooving",v)} style={{
                        padding:"12px", borderRadius:T.r, fontSize:13, fontWeight:600, cursor:"pointer", textAlign:"left",
                        border:`1.5px solid ${sel.electricGrooving===v?T.text:T.border}`,
                        background: sel.electricGrooving===v?T.text:T.bgCard,
                        color: sel.electricGrooving===v?T.white:T.text,
                      }}>
                        <div>{t}</div>
                        <div style={{ fontSize:11, color: sel.electricGrooving===v?"#888":T.textMuted, marginTop:2 }}>{s}</div>
                      </button>
                    ))}
                  </div>

                  {/* Состояние проводки */}
                  <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>Текущая проводка</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14 }}>
                    {[["new","Новая / нормальная","До 15 лет, медь"],["old","Старая / алюминий","Советская, требует замены"]].map(([v,t,s])=>(
                      <button key={v} onClick={()=>upd("electricAge",v)} style={{
                        padding:"12px", borderRadius:T.r, fontSize:13, fontWeight:600, cursor:"pointer", textAlign:"left",
                        border:`1.5px solid ${sel.electricAge===v?T.text:T.border}`,
                        background: sel.electricAge===v?T.text:T.bgCard,
                        color: sel.electricAge===v?T.white:T.text,
                      }}>
                        <div>{t}</div>
                        <div style={{ fontSize:11, color: sel.electricAge===v?"#888":T.textMuted, marginTop:2 }}>{s}</div>
                      </button>
                    ))}
                  </div>

                  {/* Количество точек */}
                  <div style={{ background:T.bgCard, border:`1px solid ${T.border}`, borderRadius:T.r, padding:"16px", marginBottom:8 }}>
                    <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:12 }}>Количество точек</div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10 }}>
                      <NumInput label="Розетки" value={sel.electricOutlets} onChange={v=>upd("electricOutlets",v)} suffix="шт"/>
                      <NumInput label="Выключатели" value={sel.electricSwitches} onChange={v=>upd("electricSwitches",v)} suffix="шт"/>
                      <NumInput label="Светильники" value={sel.electricLights} onChange={v=>upd("electricLights",v)} suffix="шт"/>
                    </div>
                    <div style={{ fontSize:11, color:T.textMuted, marginTop:10 }}>
                      Если не знаете точное количество — укажите примерно
                    </div>
                  </div>
                </>)}
                <Nav/>
              </>)}

              {stage === "plumbing" && (<>
                <StageHeader icon={STAGE_ICONS.plumbing} title="Сантехника" subtitle="Трубы, разводка, подключения."/>
                <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                  letterSpacing:"0.06em", marginBottom:10 }}>Где нужны трубы?</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:14 }}>
                  {[["sanuzul","🚿 Только санузел"],["kitchen","🍳 Только кухня"],["all","🏠 Всё вместе"]].map(([v,l])=>(
                    <button key={v} onClick={()=>upd("plumbingLocation",v)} style={{
                      padding:"10px 8px", borderRadius:T.r, fontSize:12, fontWeight:600, cursor:"pointer",
                      border:`1.5px solid ${sel.plumbingLocation===v?T.text:T.border}`,
                      background: sel.plumbingLocation===v?T.text:T.bgCard,
                      color: sel.plumbingLocation===v?T.white:T.text, textAlign:"center",
                    }}>{l}</button>
                  ))}
                </div>
                <div style={{ background:T.bgCard, border:`1px solid ${T.border}`, borderRadius:T.r,
                  padding:"14px 16px", marginBottom:8 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                    letterSpacing:"0.06em", marginBottom:10 }}>Метраж труб (погонные метры)</div>
                  <NumInput label="Метры труб" value={sel.plumbingMeters}
                    onChange={v=>upd("plumbingMeters",v)} suffix="п/м"/>
                </div>
                {[["none","Не трогаем",""],["partial","Частично заменить","Подводка к приборам"],
                  ["full","Полная замена","Все стояки и разводка"]].map(([v,t,s])=>(
                  <OptionRow key={v} icon={STAGE_ICONS.plumbing} title={t} sub={s}
                    onClick={()=>upd("plumbing",v)} active={sel.plumbing===v}/>
                ))}
                <Nav/>
              </>)}

              {stage === "bathroom" && (<>
                <StageHeader icon={STAGE_ICONS.bathroom} title="Санузел" subtitle="Расскажите про ваш санузел."/>
                {sel.bathroomCount === "2" ? (
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:14 }}>
                    <ZoneInput value={sa.bathroom} onChange={v=>updArea("bathroom",v)} placeholder="Санузел 1, м²"/>
                    <ZoneInput value={sa.bathroom2} onChange={v=>updArea("bathroom2",v)} placeholder="Санузел 2, м²"/>
                  </div>
                ) : (
                  <ZoneInput value={sa.bathroom} onChange={v=>updArea("bathroom",v)} placeholder="Площадь санузла, м²"/>
                )}

                {/* Тип санузла */}
                <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>Планировка</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14 }}>
                  {[["combined","Совмещённый","Ванна/душ и туалет вместе"],["separate","Раздельный","Ванная и туалет отдельно"]].map(([v,t,s])=>(
                    <button key={v} onClick={()=>upd("bathroomType",v)} style={{
                      padding:"12px", borderRadius:T.r, fontSize:13, fontWeight:600, cursor:"pointer", textAlign:"left",
                      border:`1.5px solid ${sel.bathroomType===v?T.text:T.border}`,
                      background: sel.bathroomType===v?T.text:T.bgCard,
                      color: sel.bathroomType===v?T.white:T.text,
                    }}>
                      <div>{t}</div>
                      <div style={{ fontSize:11, color: sel.bathroomType===v?"#888":T.textMuted, marginTop:2 }}>{s}</div>
                    </button>
                  ))}
                </div>

                {/* Количество санузлов */}
                <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>Количество санузлов</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14 }}>
                  {[["1","1 санузел"],["2","2 санузла"]].map(([v,l])=>(
                    <button key={v} onClick={()=>upd("bathroomCount",v)} style={{
                      padding:"12px", borderRadius:T.r, fontSize:14, fontWeight:700, cursor:"pointer", textAlign:"center",
                      border:`1.5px solid ${sel.bathroomCount===v?T.text:T.border}`,
                      background: sel.bathroomCount===v?T.text:T.bgCard,
                      color: sel.bathroomCount===v?T.accent:T.text,
                    }}>{l}</button>
                  ))}
                </div>

                {/* Тип сантехники */}
                <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>Сантехника</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:14 }}>
                  {[["shower","🚿 Душевая"],["bath","🛁 Ванна"],["both","🛁🚿 Оба"]].map(([v,l])=>(
                    <button key={v} onClick={()=>upd("bathroomFixtureType",v)} style={{
                      padding:"10px 8px", borderRadius:T.r, fontSize:12, fontWeight:600, cursor:"pointer",
                      border:`1.5px solid ${sel.bathroomFixtureType===v?T.text:T.border}`,
                      background: sel.bathroomFixtureType===v?T.text:T.bgCard,
                      color: sel.bathroomFixtureType===v?T.white:T.text, textAlign:"center",
                    }}>{l}</button>
                  ))}
                </div>

                {/* Объём работ */}
                <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>Объём работ</div>
                {[
                  ["none",         "Не трогаем",              "Оставляем как есть"],
                  ["replace_only", "Только замена сантехники", "Смеситель, унитаз, душ/ванна"],
                  ["cosmetic",     "Косметика",               "Замена смесителей, подкраска, мелочи"],
                  ["partial",      "Частичный ремонт",        "Часть плитки, сантехника, потолок"],
                  ["full_1",       sel.bathroomCount==="2" ? "Полный ремонт обоих" : "Полный ремонт", "Плитка, сантехника, потолок, всё"],
                ].map(([v,t,s])=>(
                  <OptionRow key={v} icon={STAGE_ICONS.bathroom} title={t} sub={s}
                    onClick={()=>upd("bathroom",v)} active={sel.bathroom===v}/>
                ))}
                <Nav/>
              </>)}

              {stage === "kitchen" && (<>
                <StageHeader icon={STAGE_ICONS.kitchen} title="Кухня" subtitle="Ремонт кухонной зоны (без мебели и техники)."/>
                <ZoneInput value={sa.kitchen} onChange={v=>updArea("kitchen",v)} placeholder="Площадь кухонной зоны"/>
                {[["none","Не трогаем",""],["basic","Обычный ремонт","Стены, пол, потолок"],
                  ["with_apron","С фартуком","Под кухонный гарнитур"]].map(([v,t,s])=>(
                  <OptionRow key={v} icon={STAGE_ICONS.kitchen} title={t} sub={s}
                    onClick={()=>upd("kitchen",v)} active={sel.kitchen===v}/>
                ))}
                <Nav/>
              </>)}

              {stage === "ceiling" && (<>
                <StageHeader icon={STAGE_ICONS.ceiling} title="Потолки" subtitle={null}/>
                {[
                  ["none",    "Не трогаем",          "Оставляем как есть"],
                  ["stretch", "Натяжной потолок",    "Глянец или матовый"],
                  ["paint",   "Под покраску",         "Шпаклёвка и покраска"],
                  ["gypsum",  "Гипсокартон",         "Многоуровневый или ровный ГКЛ"],
                ].map(([v,t,s])=>(
                  <OptionRow key={v} icon={STAGE_ICONS.ceiling} title={t} sub={s}
                    onClick={()=>upd("ceiling",v)} active={sel.ceiling===v}/>
                ))}
                <Nav/>
              </>)}

              {stage === "floor" && (<>
                <StageHeader icon={STAGE_ICONS.floor} title="Полы" subtitle="Покрытие и подготовка основания."/>
                <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                  letterSpacing:"0.06em", marginBottom:8 }}>Покрытие</div>
                <div style={{ display:"grid", gridTemplateColumns: isMobile?"1fr 1fr":"1fr 1fr 1fr", gap:8, marginBottom:14 }}>
                  {[["none","Не трогаем"],["linoleum","Линолеум"],["laminate","Ламинат"],
                    ["spc","SPC / Кварцвинил"],["tile","Плитка"]].map(([v,l])=>(
                    <StagePill key={v} label={l} icon={STAGE_ICONS.floor}
                      selected={sel.floorCovering===v} onClick={()=>upd("floorCovering",v)}/>
                  ))}
                </div>
                {/* Выравнивание — авто если стяжка в черновых */}
                {(sel.roughItems||[]).includes("screed") ? (
                  <div style={{ background:T.greenLight, border:`1px solid #A8D5B5`, borderRadius:T.r,
                    padding:"12px 16px", marginBottom:8 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:T.greenText }}>
                      ✓ Выравнивание включено в черновые работы (стяжка)
                    </div>
                  </div>
                ) : (
                  <>
                    <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                      letterSpacing:"0.06em", marginBottom:8 }}>
                      Выравнивание пола · +{CONFIG.independent.prices.floorLevelingM2.toLocaleString()} ₸/м²
                    </div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:4 }}>
                      {[["yes","✓ Добавить стяжку"],["no","— Не нужно"]].map(([v,l])=>(
                        <button key={v} onClick={()=>upd("floorLeveling",v)} style={{
                          padding:"12px", borderRadius:T.r, fontSize:13, fontWeight:600, cursor:"pointer",
                          border:`1.5px solid ${sel.floorLeveling===v?T.text:T.border}`,
                          background: sel.floorLeveling===v?T.text:T.bgCard,
                          color: sel.floorLeveling===v?T.white:T.text,
                        }}>{l}</button>
                      ))}
                    </div>
                  </>
                )}
                <Nav/>
              </>)}

              {stage === "walls" && (<>
                <StageHeader icon={STAGE_ICONS.walls} title="Стены" subtitle="Отделка и подготовка."/>
                {[["none","Не трогаем",""],["wallpaper","Обои",""],
                  ["paint","Покраска",""],["decorative","Декоративная отделка","Штукатурка, венецианка"]].map(([v,t,s])=>(
                  <OptionRow key={v} icon={STAGE_ICONS.walls} title={t} sub={s}
                    onClick={()=>upd("walls",v)} active={sel.walls===v}/>
                ))}
                {/* Выравнивание — авто если штукатурка в черновых */}
                {(sel.roughItems||[]).includes("plastering") ? (
                  <div style={{ background:T.greenLight, border:`1px solid #A8D5B5`, borderRadius:T.r,
                    padding:"12px 16px", marginTop:14 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:T.greenText }}>
                      ✓ Штукатурка стен включена в черновые работы
                    </div>
                  </div>
                ) : (
                  <>
                    <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, textTransform:"uppercase",
                      letterSpacing:"0.06em", margin:"14px 0 8px" }}>
                      Штукатурка стен · +{CONFIG.independent.prices.wallLevelingM2.toLocaleString()} ₸/м²
                    </div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                      {[["yes","✓ Добавить штукатурку"],["no","— Не нужно"]].map(([v,l])=>(
                        <button key={v} onClick={()=>upd("wallLeveling",v)} style={{
                          padding:"12px", borderRadius:T.r, fontSize:13, fontWeight:600, cursor:"pointer",
                          border:`1.5px solid ${sel.wallLeveling===v?T.text:T.border}`,
                          background: sel.wallLeveling===v?T.text:T.bgCard,
                          color: sel.wallLeveling===v?T.white:T.text,
                        }}>{l}</button>
                      ))}
                    </div>
                  </>
                )}
                <Nav/>
              </>)}
            </WizardWrap>
          </div>
        );
      }

      return <div/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RayoCalculator/>);
  </script>
</body>
</html>
